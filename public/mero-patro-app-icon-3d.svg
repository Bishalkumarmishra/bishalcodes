<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Glossy Red Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Inner Calendar Card -->
  <g filter="url(#shadow3d)">
    <!-- Calendar Card Base -->
    <rect x="100" y="60" width="312" height="300" rx="36" fill="#ffffff"/>
    
    <!-- Red Top Header of Calendar Sheet -->
    <path d="M 100,96 C 100,76 116,60 136,60 L 376,60 C 396,60 412,76 412,96 L 412,130 L 100,130 Z" fill="#e51b18"/>

    <!-- Binder Peg Rings -->
    <rect x="150" y="40" width="24" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="338" y="40" width="24" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Nepal Flag Sun & Moon emblem in Calendar -->
    <!-- Moon -->
    <path d="M 330,165 C 345,165 360,175 360,190 C 360,205 340,215 320,208 C 340,205 350,192 350,180 C 350,168 335,165 330,165 Z" fill="#e51b18"/>
    <!-- Sun -->
    <circle cx="340" cy="235" r="16" fill="#e51b18"/>

    <!-- Pagoda Temple (Red Nyatapola Temple Silhouette) -->
    <path d="M 256,150 L 268,170 L 244,170 Z" fill="#e51b18"/>
    <path d="M 230,185 L 282,185 L 274,172 L 238,172 Z" fill="#e51b18"/>
    <path d="M 215,205 L 297,205 L 287,187 L 225,187 Z" fill="#e51b18"/>
    <path d="M 200,230 L 312,230 L 300,207 L 212,207 Z" fill="#e51b18"/>
    <rect x="236" y="230" width="40" height="55" fill="#e51b18"/>

    <!-- Snow Mountains (Blue Himalayas at bottom) -->
    <path d="M 100,320 L 170,250 L 230,300 L 310,235 L 412,320 L 412,360 L 100,360 Z" fill="#0f4c81"/>
    <!-- Snow caps on mountains -->
    <path d="M 170,250 L 195,280 L 180,285 L 170,270 L 155,285 L 145,280 Z" fill="#ffffff"/>
    <path d="M 310,235 L 340,275 L 325,280 L 310,260 L 295,280 L 280,270 Z" fill="#ffffff"/>
  </g>

  <!-- Bottom Text "Mero Patro" -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="1">Mero Patro</text>
</svg>
