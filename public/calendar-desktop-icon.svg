<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Squircle background gradient -->
    <linearGradient id="sqBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8191f"/>
      <stop offset="55%"  stop-color="#cc1218"/>
      <stop offset="100%" stop-color="#8c0b0f"/>
    </linearGradient>

    <!-- Calendar red header gradient -->
    <linearGradient id="calHdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8191f"/>
      <stop offset="100%" stop-color="#b80f14"/>
    </linearGradient>

    <!-- Ring gradient (glossy white pill) -->
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="20%"  stop-color="#ffffff"/>
      <stop offset="65%"  stop-color="#dde3ef"/>
      <stop offset="100%" stop-color="#aab2c4"/>
    </linearGradient>
    <linearGradient id="ringTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c8cfdc" stop-opacity="0"/>
    </linearGradient>

    <!-- Mountain blue -->
    <linearGradient id="mtnBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2466b0"/>
      <stop offset="100%" stop-color="#0d2f68"/>
    </linearGradient>

    <!-- Page curl gradient -->
    <linearGradient id="curlG" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#b8bfce"/>
      <stop offset="50%"  stop-color="#d8dde8"/>
      <stop offset="100%" stop-color="#f5f6f8"/>
    </linearGradient>

    <!-- Pagoda red gradient -->
    <linearGradient id="pagRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e82020"/>
      <stop offset="100%" stop-color="#a80e12"/>
    </linearGradient>

    <!-- Shadows/filters -->
    <filter id="calDrop" x="-20%" y="-15%" width="145%" height="155%">
      <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#1a0000" flood-opacity="0.5"/>
    </filter>
    <filter id="ringDrop" x="-60%" y="-40%" width="220%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="txtDrop" x="-15%" y="-30%" width="130%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1a0000" flood-opacity="0.7"/>
    </filter>
    <filter id="curlDrop" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="-6" dy="-6" stdDeviation="9" flood-color="#000" flood-opacity="0.22"/>
    </filter>

    <!-- Clip: inner calendar page -->
    <clipPath id="pgClip">
      <rect x="205" y="270" width="614" height="460" rx="0"/>
    </clipPath>

    <!-- Calendar header + body clip (rounded top) -->
    <clipPath id="calFullClip">
      <rect x="205" y="158" width="614" height="572" rx="50" ry="50"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════
       1. RED SQUIRCLE BACKGROUND
       ═══════════════════════════════════════════ -->
  <rect x="24" y="24" width="976" height="976" rx="228" ry="228" fill="url(#sqBg)"/>

  <!-- ═══════════════════════════════════════════
       2. CALENDAR (with full drop-shadow)
       ═══════════════════════════════════════════ -->
  <g filter="url(#calDrop)">

    <!-- White calendar body base -->
    <rect x="205" y="158" width="614" height="572" rx="50" ry="50" fill="#ffffff"/>

    <!-- ─── Red top header ─── -->
    <g clip-path="url(#calFullClip)">
      <rect x="205" y="158" width="614" height="112" fill="url(#calHdr)"/>
    </g>

    <!-- ─── Ring punch holes (dark circular recesses) ─── -->
    <!-- Left hole -->
    <circle cx="358" cy="200" r="35" fill="#7a0608"/>
    <circle cx="358" cy="200" r="28" fill="#3e0103"/>
    <!-- Right hole -->
    <circle cx="666" cy="200" r="35" fill="#7a0608"/>
    <circle cx="666" cy="200" r="28" fill="#3e0103"/>

    <!-- ─── INNER PAGE CONTENT ─── -->
    <g clip-path="url(#pgClip)">

      <!-- White page background (extends to bottom of clip) -->
      <rect x="205" y="270" width="614" height="460" fill="#ffffff"/>

      <!-- ─── NEPAL FLAG EMBLEM (top-right of white page) ─── -->
      <!-- Crescent moon (red) -->
      <path d="M700,295 C728,295 752,315 756,344
               C760,370 748,393 728,406
               C750,392 762,368 758,342
               C754,316 734,298 710,295 Z"
            fill="#cc1218"/>
      <!-- Starburst / sun (12-pointed, red) -->
      <g transform="translate(700,360)">
        <circle cx="0" cy="0" r="14" fill="#cc1218"/>
        <!-- 12 spikes -->
        <line x1="0" y1="-26" x2="0" y2="-16" stroke="#cc1218" stroke-width="5"/>
        <line x1="13" y1="-22" x2="8" y2="-14" stroke="#cc1218" stroke-width="5"/>
        <line x1="22" y1="-13" x2="14" y2="-8" stroke="#cc1218" stroke-width="5"/>
        <line x1="26" y1="0" x2="16" y2="0" stroke="#cc1218" stroke-width="5"/>
        <line x1="22" y1="13" x2="14" y2="8" stroke="#cc1218" stroke-width="5"/>
        <line x1="13" y1="22" x2="8" y2="14" stroke="#cc1218" stroke-width="5"/>
        <line x1="0" y1="26" x2="0" y2="16" stroke="#cc1218" stroke-width="5"/>
        <line x1="-13" y1="22" x2="-8" y2="14" stroke="#cc1218" stroke-width="5"/>
        <line x1="-22" y1="13" x2="-14" y2="8" stroke="#cc1218" stroke-width="5"/>
        <line x1="-26" y1="0" x2="-16" y2="0" stroke="#cc1218" stroke-width="5"/>
        <line x1="-22" y1="-13" x2="-14" y2="-8" stroke="#cc1218" stroke-width="5"/>
        <line x1="-13" y1="-22" x2="-8" y2="-14" stroke="#cc1218" stroke-width="5"/>
      </g>

      <!-- ─── RED PAGODA TEMPLE ─── -->
      <g transform="translate(436,272)">

        <!-- SPIRE / FINIAL at top -->
        <line x1="75" y1="0" x2="75" y2="18" stroke="#cc1218" stroke-width="6"/>
        <circle cx="75" cy="0" r="7" fill="#cc1218"/>

        <!-- TIER 1 – topmost tiny roof -->
        <polygon points="75,18  40,38  110,38" fill="url(#pagRed)"/>
        <!-- small underside shading -->
        <line x1="40" y1="38" x2="110" y2="38" stroke="#8c0c10" stroke-width="3"/>
        <!-- tier 1 body -->
        <rect x="52" y="38" width="46" height="22" fill="#cc1218"/>
        <!-- tier 1 mini-eave (wider) -->
        <polygon points="75,60  28,74  122,74" fill="url(#pagRed)"/>
        <line x1="28" y1="74" x2="122" y2="74" stroke="#8c0c10" stroke-width="3"/>

        <!-- TIER 2 – mid roof (wider) -->
        <rect x="46" y="74" width="58" height="30" fill="#cc1218"/>
        <!-- windows tier 2 -->
        <rect x="54" y="82" width="14" height="18" rx="2" fill="#ffffff" opacity="0.9"/>
        <rect x="82" y="82" width="14" height="18" rx="2" fill="#ffffff" opacity="0.9"/>
        <!-- tier 2 eave -->
        <polygon points="75,104  8,126  142,126" fill="url(#pagRed)"/>
        <line x1="8" y1="126" x2="142" y2="126" stroke="#8c0c10" stroke-width="3"/>

        <!-- TIER 3 – wide main body -->
        <rect x="22" y="126" width="106" height="50" fill="#cc1218"/>
        <!-- pillars -->
        <rect x="26" y="126" width="8" height="50" fill="#9e0c10"/>
        <rect x="48" y="126" width="8" height="50" fill="#9e0c10"/>
        <rect x="94" y="126" width="8" height="50" fill="#9e0c10"/>
        <rect x="116" y="126" width="8" height="50" fill="#9e0c10"/>
        <!-- center door arch -->
        <rect x="64" y="142" width="22" height="34" rx="4" fill="#ffffff" opacity="0.95"/>
        <!-- tier 3 wide eave -->
        <polygon points="75,176  -30,204  180,204" fill="url(#pagRed)"/>
        <line x1="-30" y1="204" x2="180" y2="204" stroke="#8c0c10" stroke-width="3"/>

        <!-- BASE STEPS / PLINTH -->
        <rect x="-12" y="204" width="174" height="16" fill="#9e0c10"/>
        <rect x="-26" y="220" width="202" height="14" fill="#8c0c10"/>
        <rect x="-42" y="234" width="234" height="14" fill="#780a0d"/>
      </g>
      <!-- end pagoda -->

      <!-- ─── BLUE HIMALAYAN MOUNTAINS (below pagoda, flat style) ─── -->
      <!-- Left peak -->
      <polygon points="205,730  205,560  340,390  460,530  380,730"
               fill="url(#mtnBlue)"/>
      <!-- Left peak snow highlight (white sharp ridge) -->
      <polygon points="340,390  318,430  340,424  362,430" fill="#ffffff" opacity="0.9"/>
      <polygon points="340,390  308,450  328,456  340,424" fill="#e0e8f8"/>

      <!-- Center-main peak -->
      <polygon points="300,730  490,380  680,730" fill="url(#mtnBlue)"/>
      <!-- Center snow -->
      <polygon points="490,380  465,432  490,426  515,432" fill="#ffffff" opacity="0.9"/>
      <polygon points="490,380  455,450  475,455  490,426" fill="#e0e8f8"/>

      <!-- Right slope -->
      <polygon points="580,730  680,470  819,600  819,730" fill="url(#mtnBlue)"/>
      <!-- Right peak snow -->
      <polygon points="680,470  660,516  680,510  700,516" fill="#ffffff" opacity="0.9"/>

      <!-- Mountain base solid (ground level fill) -->
      <rect x="205" y="720" width="614" height="10" fill="#0d2f68"/>

    </g>
    <!-- end page clip -->

    <!-- ─── PAGE CURL (bottom-right corner) ─── -->
    <g filter="url(#curlDrop)">
      <path d="M 698,730 C 738,710 778,665 819,568 L 819,648 Q 819,730 736,730 Z"
            fill="url(#curlG)"/>
    </g>

  </g>
  <!-- end calendar shadow group -->

  <!-- ═══════════════════════════════════════════
       3. BINDER RINGS (above calendar, prominent 3D white pills)
       ═══════════════════════════════════════════ -->
  <!-- Left ring -->
  <g filter="url(#ringDrop)">
    <rect x="336" y="120" width="44" height="152" rx="22" ry="22" fill="url(#ringG)"/>
    <!-- inner highlight -->
    <rect x="341" y="125" width="13" height="142" rx="6" fill="#ffffff" opacity="0.7"/>
    <rect x="336" y="120" width="44" height="40" rx="22" fill="url(#ringTop)"/>
  </g>
  <!-- Right ring -->
  <g filter="url(#ringDrop)">
    <rect x="644" y="120" width="44" height="152" rx="22" ry="22" fill="url(#ringG)"/>
    <rect x="649" y="125" width="13" height="142" rx="6" fill="#ffffff" opacity="0.7"/>
    <rect x="644" y="120" width="44" height="40" rx="22" fill="url(#ringTop)"/>
  </g>

  <!-- ═══════════════════════════════════════════
       4. "Mero Patro" TEXT  (on red background, below calendar)
       ═══════════════════════════════════════════ -->
  <text
    x="512" y="872"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"
    font-weight="900"
    font-size="96"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0"
    filter="url(#txtDrop)"
  >Mero Patro</text>

</svg>