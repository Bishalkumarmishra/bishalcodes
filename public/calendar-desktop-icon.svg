<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- ▸ BACKGROUND SQUIRCLE 3-Stop Gradient (deep red top → dark crimson bottom) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8191f"/>
      <stop offset="50%"  stop-color="#c9101b"/>
      <stop offset="100%" stop-color="#900a0d"/>
    </linearGradient>

    <!-- ▸ Subtle gloss overlay on squircle top -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ▸ Red calendar header gradient -->
    <linearGradient id="calHdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8191f"/>
      <stop offset="100%" stop-color="#ba1017"/>
    </linearGradient>

    <!-- ▸ Calendar white page subtle paper gradient -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f7"/>
    </linearGradient>

    <!-- ▸ Mountain blue gradient -->
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2c6db5"/>
      <stop offset="100%" stop-color="#0f2d5e"/>
    </linearGradient>

    <!-- ▸ Mountain front (slightly lighter) -->
    <linearGradient id="mtnFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3278c8"/>
      <stop offset="100%" stop-color="#143668"/>
    </linearGradient>

    <!-- ▸ Pagoda roof gradient (bright red → dark) -->
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e82c2c"/>
      <stop offset="100%" stop-color="#9c0c0e"/>
    </linearGradient>

    <!-- ▸ Metal ring binder gradient (white gloss) -->
    <linearGradient id="ring" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="30%"  stop-color="#e8ecf4"/>
      <stop offset="70%"  stop-color="#c4cad8"/>
      <stop offset="100%" stop-color="#9aa2b4"/>
    </linearGradient>

    <!-- ▸ Page curl gradient (paper fold) -->
    <linearGradient id="curl" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c8cfdc"/>
      <stop offset="50%"  stop-color="#dde2ea"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>

    <!-- ▸ Drop shadows -->
    <filter id="calShadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#1a0000" flood-opacity="0.55"/>
    </filter>
    <filter id="ringShadow" x="-50%" y="-30%" width="200%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="txtShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#250000" flood-opacity="0.7"/>
    </filter>
    <filter id="curlShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="-8" dy="-8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <!-- ▸ Clip: white calendar page area only -->
    <clipPath id="pageClip">
      <rect x="196" y="256" width="632" height="460"/>
    </clipPath>

    <!-- ▸ Pagoda roof underside shadow -->
    <linearGradient id="eaveShad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a0a0a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7a0a0a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════
       1. BACKGROUND RED SQUIRCLE
       ══════════════════════════════════════ -->
  <rect x="32" y="32" width="960" height="960" rx="218" ry="218" fill="url(#bg)"/>
  <!-- gloss layer -->
  <rect x="38" y="38" width="948" height="480" rx="212" ry="212" fill="url(#gloss)"/>

  <!-- ══════════════════════════════════════
       2. WHITE CALENDAR PAD (with shadow)
       ══════════════════════════════════════ -->
  <g filter="url(#calShadow)">

    <!-- Main white calendar body -->
    <rect x="196" y="148" width="632" height="580" rx="52" ry="52" fill="url(#paper)"/>

    <!-- Red calendar top header strip -->
    <path d="M196,200 Q196,148 248,148 L776,148 Q828,148 828,200 L828,292 L196,292 Z"
          fill="url(#calHdr)"/>

    <!-- Punch-hole ring sockets (dark recesses) -->
    <!-- Left socket -->
    <rect x="316" y="178" width="72" height="72" rx="36" ry="36" fill="#750000" opacity="0.9"/>
    <rect x="322" y="184" width="60" height="60" rx="30" ry="30" fill="#3e0002"/>
    <!-- Right socket -->
    <rect x="636" y="178" width="72" height="72" rx="36" ry="36" fill="#750000" opacity="0.9"/>
    <rect x="642" y="184" width="60" height="60" rx="30" ry="30" fill="#3e0002"/>

    <!-- ─── CALENDAR PAGE CONTENT (clipped) ─── -->
    <g clip-path="url(#pageClip)">

      <!-- ─── Blue Himalayan Mountains (back layer) ─── -->
      <!-- Far left mountain -->
      <polygon points="196,716 196,550 308,370 420,530 196,716" fill="url(#mtn)"/>
      <!-- Snow on far left peak -->
      <polygon points="308,370 275,430 295,440 268,470 308,452 340,476 325,436 358,448" fill="#ffffff"/>
      <polygon points="308,370 295,440 308,452 325,436" fill="#dce8f8"/>

      <!-- Main center-left mountain -->
      <polygon points="196,716 370,716 535,395 700,716 620,716" fill="url(#mtn)"/>
      <!-- Snow on center peak -->
      <polygon points="535,395 498,460 520,468 490,510 535,488 572,518 558,468 594,480" fill="#ffffff"/>
      <polygon points="535,395 520,468 535,488 558,468" fill="#dce8f8"/>

      <!-- Right mountain -->
      <polygon points="560,716 828,716 828,560 700,420 560,596" fill="url(#mtnFront)"/>
      <!-- Snow on right peak -->
      <polygon points="700,420 668,482 690,490 660,528 700,506 732,534 720,486 758,498" fill="#ffffff"/>
      <polygon points="700,420 690,490 700,506 720,486" fill="#dce8f8"/>

      <!-- Mountain base fill (ground line) -->
      <rect x="196" y="700" width="632" height="16" fill="#0f2d5e"/>

      <!-- ─── Red Pagoda Temple (center) ─── -->
      <g transform="translate(512,262)">
        <!-- Gajur pinnacle tip -->
        <ellipse cx="0" cy="-28" rx="5" ry="7" fill="#e51c22"/>
        <polygon points="0,-22  5,-10  3,-10  6,0  -6,0  -3,-10  -5,-10" fill="#c8101a"/>

        <!-- Level 1 (topmost tiny roof) -->
        <polygon points="0,-8  44,14  -44,14" fill="url(#roof)"/>
        <rect x="-44" y="14" width="88" height="7" rx="2" fill="#7a0c0e"/>
        <!-- eave underside -->
        <rect x="-44" y="14" width="88" height="4" fill="url(#eaveShad)"/>

        <!-- Level 1 body -->
        <rect x="-22" y="21" width="44" height="20" fill="#c8101a"/>

        <!-- Level 2 roof -->
        <polygon points="0,40  80,68  -80,68" fill="url(#roof)"/>
        <rect x="-80" y="68" width="160" height="9" rx="2" fill="#7a0c0e"/>
        <rect x="-80" y="68" width="160" height="5" fill="url(#eaveShad)"/>

        <!-- Level 2 body -->
        <rect x="-42" y="77" width="84" height="26" fill="#c8101a"/>
        <!-- small windows level 2 -->
        <rect x="-30" y="82" width="14" height="16" rx="2" fill="#ffffff" opacity="0.9"/>
        <rect x="-7" y="82" width="14" height="16" rx="2" fill="#ffffff" opacity="0.9"/>
        <rect x="16" y="82" width="14" height="16" rx="2" fill="#ffffff" opacity="0.9"/>

        <!-- Level 3 (wide main) roof -->
        <polygon points="0,103  155,142  -155,142" fill="url(#roof)"/>
        <rect x="-155" y="142" width="310" height="11" rx="2" fill="#7a0c0e"/>
        <rect x="-155" y="142" width="310" height="6" fill="url(#eaveShad)"/>

        <!-- Level 3 body / main facade -->
        <rect x="-80" y="153" width="160" height="68" fill="#c8101a"/>
        <!-- pillars -->
        <rect x="-72" y="153" width="10" height="68" fill="#9e0c10"/>
        <rect x="-35" y="153" width="10" height="68" fill="#9e0c10"/>
        <rect x="25"  y="153" width="10" height="68" fill="#9e0c10"/>
        <rect x="62"  y="153" width="10" height="68" fill="#9e0c10"/>
        <!-- center main door -->
        <rect x="-22" y="180" width="44" height="41" rx="4" fill="#ffffff" opacity="0.95"/>
        <!-- side windows -->
        <rect x="-65" y="165" width="20" height="28" rx="3" fill="#ffffff" opacity="0.9"/>
        <rect x="45"  y="165" width="20" height="28" rx="3" fill="#ffffff" opacity="0.9"/>

        <!-- Plinth steps -->
        <rect x="-100" y="221" width="200" height="12" rx="2" fill="#9e0c10"/>
        <rect x="-115" y="233" width="230" height="13" rx="2" fill="#7a0c0e"/>
        <rect x="-130" y="246" width="260" height="14" rx="2" fill="#600a0d"/>
      </g>

      <!-- ─── Nepal Sun & Moon emblems (top-right of white page) ─── -->
      <!-- Crescent Moon -->
      <path d="M694,278 C720,278 744,298 748,328
               C752,352 742,376 724,390
               C745,375 756,352 752,326
               C748,302 730,284 708,280
               C703,279 698,278 694,278 Z"
            fill="#e51c22"/>
      <!-- 12-pointed starburst / sun -->
      <g transform="translate(672,345) scale(0.9)">
        <polygon points="0,-28 3,-10 10,-18 5,-2 20,-8 8,4 22,12 6,10 14,26 2,16 2,32 -2,16 -14,26 -6,10 -22,12 -8,4 -20,-8 -5,-2 -10,-18 -3,-10" fill="#e51c22"/>
      </g>

    </g>
    <!-- end pageClip -->

    <!-- ─── Page curl bottom-right corner ─── -->
    <g filter="url(#curlShadow)">
      <path d="M 700,728 C740,710 780,668 828,572 L828,640 Q828,728 740,728 Z"
            fill="url(#curl)"/>
    </g>

    <!-- ─── Binder Rings (front, with 3D metallic gloss) ─── -->
    <!-- Left ring -->
    <g filter="url(#ringShadow)">
      <rect x="328" y="114" width="48" height="140" rx="24" ry="24" fill="url(#ring)"/>
      <!-- gloss highlight stripe on ring -->
      <rect x="333" y="119" width="11" height="130" rx="5" fill="#ffffff" opacity="0.75"/>
    </g>
    <!-- Right ring -->
    <g filter="url(#ringShadow)">
      <rect x="648" y="114" width="48" height="140" rx="24" ry="24" fill="url(#ring)"/>
      <rect x="653" y="119" width="11" height="130" rx="5" fill="#ffffff" opacity="0.75"/>
    </g>

  </g>
  <!-- end calShadow group -->

  <!-- ══════════════════════════════════════
       3. "Mero Patro" BOLD TEXT AT BOTTOM
       ══════════════════════════════════════ -->
  <text
    x="512" y="860"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"
    font-weight="900"
    font-size="88"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="1"
    filter="url(#txtShadow)"
  >Mero Patro</text>

</svg>